<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Nexo</title>
  <meta name="theme-color" content="#161920" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Nexo" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <script>
    // Aplica tema e cor antes de desenhar (o resto fica em js/theme.js).
    try {
      var t = localStorage.getItem('nexo.theme') || 'dark';
      if (t === 'auto') t = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
      document.documentElement.dataset.theme = t;
      var a = localStorage.getItem('nexo.accent');
      if (a && /^#[0-9a-f]{6}$/i.test(a)) document.documentElement.style.setProperty('--accent', a);
    } catch (e) {}
  </script>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%23ff7a45'/%3E%3Ctext x='16' y='22' font-family='Arial' font-weight='800' font-size='17' text-anchor='middle' fill='%231a0d06'%3EN%3C/text%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <!-- Tela de login / cadastro -->
  <main id="auth" class="auth" hidden>
    <div class="auth-card">
      <div class="brand"><span class="brand-mark">N</span> Nexo</div>
      <h1 id="auth-title">Bem-vindo de volta</h1>
      <p class="muted" id="auth-subtitle">Entre para continuar a conversa.</p>
      <form id="auth-form" autocomplete="on">
        <label>Usuário
          <input name="username" required minlength="3" maxlength="32" autocomplete="username" autocapitalize="none" spellcheck="false" />
        </label>
        <label id="display-name-field" hidden>Nome de exibição
          <input name="displayName" maxlength="32" autocomplete="nickname" />
        </label>
        <label id="reg-code-field" hidden>Código de cadastro
          <input name="inviteCode" maxlength="100" autocomplete="off" spellcheck="false" placeholder="Peça para quem administra o Nexo" />
        </label>
        <label>Senha
          <input name="password" type="password" required minlength="6" maxlength="128" autocomplete="current-password" />
        </label>
        <p class="form-error" id="auth-error" role="alert"></p>
        <button class="btn primary" type="submit" id="auth-submit">Entrar</button>
      </form>
      <form id="auth-code-form" autocomplete="off" hidden>
        <label>Código de 6 dígitos (ou de recuperação)
          <input name="code" required maxlength="12" inputmode="numeric" autocomplete="one-time-code" spellcheck="false" placeholder="123456" />
        </label>
        <p class="form-error" id="auth-code-error" role="alert"></p>
        <button class="btn primary" type="submit" id="auth-code-submit">Confirmar</button>
        <button class="link back-link" type="button" id="auth-code-back">← Voltar</button>
      </form>
      <p class="auth-switch">
        <span id="auth-switch-text">Não tem conta?</span>
        <button class="link" type="button" id="auth-switch">Cadastre-se</button>
      </p>
    </div>
  </main>

  <!-- App principal -->
  <div id="app" class="app" hidden>
    <nav class="rail" aria-label="Servidores">
      <button class="rail-btn home" id="home-btn" title="Mensagens diretas e amigos">
        N<span class="badge-slot"></span>
      </button>
      <div class="rail-sep"></div>
      <div id="server-list" class="server-list"></div>
      <button class="rail-btn add" id="btn-create-server" title="Criar servidor">+</button>
      <button class="rail-btn join" id="btn-join-server" title="Entrar com convite">↪</button>
    </nav>

    <aside class="sidebar">
      <header class="sidebar-header" id="sidebar-header"></header>
      <div class="sidebar-body" id="sidebar-body"></div>
      <div class="voice-panel" id="voice-panel" hidden></div>
      <footer class="user-panel">
        <button class="me-info" id="me-info" title="Opções da conta">
          <span id="me-avatar"></span>
          <span class="user-meta">
            <strong id="me-name" class="truncate"></strong>
            <span id="me-username" class="muted truncate"></span>
          </span>
        </button>
        <button class="icon-btn" id="btn-sound" title="Som de notificação">🔔</button>
        <button class="icon-btn" id="btn-logout" title="Sair da conta">Sair</button>
      </footer>
    </aside>

    <section class="chat" id="main">
      <header class="chat-header">
        <button class="icon-btn mobile-only" id="btn-toggle-sidebar" title="Canais">☰</button>
        <div class="chat-title" id="chat-title"></div>
        <span class="conn-status" id="conn-status" hidden>Reconectando…</span>
        <button class="icon-btn" id="btn-pins" title="Mensagens fixadas" hidden>📌</button>
        <div class="search-box">
          <input type="search" id="search-input" placeholder="Buscar" maxlength="200" autocomplete="off" aria-label="Buscar mensagens" />
        </div>
        <button class="icon-btn mobile-hide" id="btn-toggle-members" title="Mostrar/esconder membros">Membros</button>
      </header>

      <div class="main-body">
        <div class="messages" id="messages"></div>
        <div class="friends-page" id="friends-page" hidden></div>
        <div class="voice-stage" id="voice-stage" hidden></div>
        <div class="drop-overlay" id="drop-overlay" hidden><div>📎 Solte para anexar</div></div>
      </div>

      <div class="composer-area" id="composer-area" hidden>
        <div class="typing" id="typing" aria-live="polite"></div>
        <div class="autocomplete" id="autocomplete" hidden></div>
        <div class="uploads" id="uploads" hidden></div>
        <div class="reply-bar" id="reply-bar" hidden></div>
        <div class="recorder" id="recorder" hidden></div>
        <form class="composer" id="composer">
          <button type="button" class="composer-btn" id="btn-attach" title="Anexar arquivos">＋</button>
          <input type="file" id="file-input" multiple hidden />
          <textarea id="composer-input" rows="1" maxlength="4000" placeholder="Mensagem"></textarea>
          <button type="button" class="composer-btn" id="btn-emoji" title="Emojis">😊</button>
          <button type="button" class="composer-btn" id="btn-voice" title="Gravar mensagem de voz">🎤</button>
          <button class="btn primary send" type="submit">Enviar</button>
        </form>
      </div>
    </section>

    <aside class="members" id="members-panel">
      <div id="member-list"></div>
    </aside>

    <aside class="search-panel" id="search-panel" hidden aria-label="Resultados da busca"></aside>
  </div>

  <div class="toast" id="toast" role="status"></div>
  <!-- O áudio de quem está na voz toca por aqui (invisível). -->
  <div id="voice-audio" hidden></div>

  <!-- Cliente do Socket.IO é servido pelo próprio backend -->
  <script src="/socket.io/socket.io.js"></script>
  <script type="module" src="/js/main.js"></script>
</body>
</html>
