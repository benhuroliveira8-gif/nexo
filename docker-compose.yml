# Nome fixo do projeto: assim tanto você (na pasta ~/nexo) quanto o Jenkins
# (na pasta dele) atualizam os MESMOS containers.
name: nexo

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: nexo
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Defina DB_PASSWORD no arquivo .env}
      POSTGRES_DB: nexo
    volumes:
      - nexo_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexo -d nexo"]
      interval: 5s
      timeout: 3s
      retries: 20

  app:
    build: ./app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://nexo:${DB_PASSWORD}@db:5432/nexo
      JWT_SECRET: ${JWT_SECRET:?Defina JWT_SECRET no arquivo .env}
      PORT: 3000
      UPLOAD_DIR: /data/uploads
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-8}
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:?Defina LIVEKIT_API_KEY no .env (rode infra/completar-env.sh)}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:?Defina LIVEKIT_API_SECRET no .env (rode infra/completar-env.sh)}
      # Opcional: exige este código para criar conta (bom quando o Nexo está na internet).
      REGISTRATION_CODE: ${REGISTRATION_CODE:-}
      # Fase 5 (opcionais): prévias de link (0 desliga) e contato das notificações push.
      LINK_PREVIEWS: ${LINK_PREVIEWS:-1}
      PUSH_CONTACT: ${PUSH_CONTACT:-}
      # GIFs (opcional): chave do KLIPY e classificação máxima (g, pg, pg-13, r).
      KLIPY_API_KEY: ${KLIPY_API_KEY:-}
      GIF_RATING: ${GIF_RATING:-pg-13}
      # Endereço interno do LiveKit (para o modo palco liberar/tirar a fala na hora).
      LIVEKIT_INTERNAL_URL: ${LIVEKIT_INTERNAL_URL:-http://livekit:7880}
      # "Ouvindo" automático (opcional): chave grátis do Last.fm.
      LASTFM_API_KEY: ${LASTFM_API_KEY:-}
      # Quem vira administrador do Nexo além da primeira conta (nomes de usuário separados por vírgula).
      NEXO_ADMINS: ${NEXO_ADMINS:-}
      # Transcrição dos áudios no servidor (opcional): ligue o perfil "transcricao" (veja docs/transcricao.md).
      WHISPER_URL: ${WHISPER_URL:-}
      # Onde o painel de saúde procura os backups (só leitura).
      BACKUP_DIR: /backups
    # Dá tempo de avisar todo mundo antes de desligar numa atualização.
    stop_grace_period: 15s
    volumes:
      - nexo_uploads:/data/uploads
      - ${BACKUP_DIR:-/var/backups/nexo}:/backups:ro
    ports:
      - "${APP_PORT:-3000}:3000"

  # Transcrição das mensagens de voz (opcional, usa ~1 GB de memória).
  # Para ligar: no .env, COMPOSE_PROFILES=transcricao e WHISPER_URL=http://whisper:9000
  whisper:
    image: onerahmet/openai-whisper-asr-webservice:latest
    profiles: ["transcricao"]
    restart: unless-stopped
    environment:
      ASR_ENGINE: faster_whisper
      ASR_MODEL: ${WHISPER_MODEL:-base}
    volumes:
      - whisper_cache:/root/.cache

  # HTTPS na frente do app (o navegador exige HTTPS para microfone e câmera).
  caddy:
    build: ./infra/caddy
    restart: unless-stopped
    depends_on:
      - app
      - livekit
    environment:
      NEXO_HOST: ${NEXO_HOST:?Defina NEXO_HOST no .env (rode infra/completar-env.sh)}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - caddy_data:/data
      - caddy_config:/config

  # Servidor de voz e vídeo.
  livekit:
    build: ./infra/livekit
    restart: unless-stopped
    command: ["--config", "/etc/livekit.yaml", "--node-ip", "${NEXO_HOST}"]
    environment:
      LIVEKIT_KEYS: "${LIVEKIT_API_KEY}: ${LIVEKIT_API_SECRET}"
    ports:
      - "7881:7881/tcp"
      - "7882:7882/udp"

  # Bot de exemplo. Só sobe se você pedir:
  #   docker compose --profile bots up -d --build bot-exemplo
  bot-exemplo:
    build: ./examples/bot-exemplo
    profiles: ["bots"]
    restart: unless-stopped
    depends_on:
      - app
    environment:
      NEXO_URL: http://app:3000
      BOT_TOKEN: ${BOT_TOKEN:-}

  # Backup do banco + anexos. Não fica ligado: roda e termina.
  #   docker compose --profile backup run --rm --build backup            (fazer agora)
  #   docker compose --profile backup run --rm backup listar             (ver backups)
  #   bash infra/backup/restaurar.sh ultimo                              (restaurar)
  # O Jenkins roda todo dia sozinho (job nexo-backup).
  backup:
    build: ./infra/backup
    profiles: ["backup"]
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGHOST: db
      PGUSER: nexo
      PGDATABASE: nexo
      PGPASSWORD: ${DB_PASSWORD}
      KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
      TZ: ${TZ:-America/Sao_Paulo}
    volumes:
      - nexo_uploads:/uploads
      # Pasta da VM onde os backups ficam (caminho completo, funciona até pelo Jenkins).
      - ${BACKUP_DIR:-/var/backups/nexo}:/backups

volumes:
  whisper_cache:
  nexo_db:
  nexo_uploads:
  caddy_data:
  caddy_config:
